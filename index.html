<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MADDY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
            MADDY
        </div>

        <nav>
            <a href="#">SHOP</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </nav>
    
        <div class="actions">
            <button>SEARCH</button>
            <button>BAG</button>
        </div>
        
    </header>

    <main>

        <section class="hero">

            <div class="hero-text">

                <p>
                    MADDY IS BUILT FOR THOSE WHO
                    CHOOSE FORM OVER NOISE —
                    AND LET THE WORK SPEAK
                    WHERE WORDS DON'T HAVE TO
                </p>

                <button class="shop-btn">
                    SHOP THE DROP →
                </button>

            </div>

            <img class="hero-model" src="assets/model.jpg" alt="MADDY fashion model">

            <h1 class="hero-title">
            SPEAK QUIET
            </h1>

            <div class="hero-description">

                <p>FASHION WITHOUT THE SHOUT</p>

                <p>A QUIET ANSWER TO LOUD FASHION BRANDING</p>

            </div>

        </section>

    </main>


</body>
</html>
