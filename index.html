<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MADDY</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="grid grid-cols-[1fr_auto] lg:grid-cols-[1fr_auto_1fr] items-center h-[70px] px-[20px] lg:px-[30px]">
        <div class="font-semibold text-[18px] lg:text-[23px] justify-self-start">
            MADDY
        </div>

        <nav class="hidden lg:flex gap-[60px] font-semibold">
            <a href="#" class="text-[18px]">SHOP</a>
            <a href="#" class="text-[18px]">ABOUT</a>
            <a href="#" class="text-[18px]">CONTACT</a>
        </nav>
    
        <div class="flex gap-[20px] font-semibold justify-self-end">
            <button class="flex items-center gap-[6px] text-[12px] font-semibold">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    class="w-[20px] h-[20px] lg:w-[28px] lg:h-[28px]"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20L16.5 16.5"></path>
                </svg>

                <span class="hidden sm:inline">SEARCH</span>
            </button>

            <button class="flex items-center gap-[6px] text-[12px] font-semibold">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    class="w-[20px] h-[20px] lg:w-[28px] lg:h-[28px]"
                >
                    <path d="M6 8H18L19 20H5L6 8Z"></path>
                    <path d="M9 8V6C9 4.3 10.3 3 12 3C13.7 3 15 4.3 15 6V8"></path>
                </svg>

                <span class="hidden sm:inline">BAG</span>
            </button>
            <button class="lg:hidden text-[22px]">
                ☰
            </button>


        </div>
    </header>

    <main>
        <section class="relative w-full h-[calc(100vh-66px)] overflow-hidden bg-[#f7f6f9]
        bg-[linear-gradient(to_right,rgba(0,0,0,0.06)_1px,transparent_1px),linear-gradient(to_bottom,rgba(0,0,0,0.06)_1px,transparent_1px)]
        bg-[size:20%_33.333%]
        ">
            <div class="absolute left-[5vw] top-[20%] w-[30vw] z-30">
                <p class="text-[25px] leading-[1.5] tracking-[-0.04em] font-normal">
                    <span class="block ml-[9.7vw]">
                        MADDY IS BUILT FOR THOSE WHO
                    </span>

                    <span class="block">
                        CHOOSE FORM OVER NOISE — AND LET THE WORK
                    </span>

                    <span class="block">
                        SPEAK WHERE WORDS DON'T HAVE TO
                    </span>
                </p>
            

                <button  class="mt-[20px] w-[300px] bg-[#2b2b2b] text-white px-[80px] py-[15px] rounded-[8px] text-[15px] font-medium tracking-[0.03em] flex items-center justify-between">
                    SHOP THE DROP →
                </button>
            </div>

            <img src="assets/model.jpg" alt="MADDY fashion model"
                class="absolute left-1/2 bottom-0 -translate-x-1/2 scale-x-[1.05] w-[35vw] z-10">

            <h1 class="absolute left-1/2 bottom-[3vh] -translate-x-1/2 z-20 text-[15vw] font-normal whitespace-nowrap text-white mix-blend-difference">
            SPEAK QUIET
            </h1>

            <div class="absolute right-[10vw] top-[40%] w-[10vw] z-30">
                <p class="text-[18px] leading-[1.5] tracking-[0.05em] font-normal">
                    <span class="block">
                        FASHION WITHOUT 
                    </span>

                    <span class="block text-right pr-[20px]">
                        THE SHOUT
                    </span>
                </p>
            </div>

        </section>

    </main>
    <script src="script.js"></script>

</body>
</html>
